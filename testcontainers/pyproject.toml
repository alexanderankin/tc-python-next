[project]
name = "testcontainers"
version = "0.0.1"
description = "Testcontainers implementation for Python"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "jproperties==2.1.2",
]

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "coverage>=7.0.0",
]
lint = [
    "ruff>=0.1.0",
    "ty>=0.0.1",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.pytest.ini_options]
testpaths = ["test"]
#addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "test"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "EXE"]
